[package]
name = "agent-undo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Flight recorder and undo for what coding agents do to a project directory"
license = "MIT"
repository = "https://github.com/kienpt91/agent-undo"
readme = "README.md"
keywords = ["undo", "snapshot", "agents", "cli"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[lib]
name = "agent_undo"
path = "src/lib.rs"

[[bin]]
name = "agent-undo"
path = "src/main.rs"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 2
overflow-checks = true

[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
lto = "thin"
strip = true
