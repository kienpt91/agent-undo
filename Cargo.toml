[workspace]
resolver = "3"
members = ["crates/domain", "crates/app", "crates/infra", "crates/cli", "crates/memcheck"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kienpt91/agent-undo"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 2
overflow-checks = true

[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
lto = "thin"
strip = true
